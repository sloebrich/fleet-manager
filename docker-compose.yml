services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 -i healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 10
  controller:
    build: .
    command:
      - /app/controller
      - -broker
      - broker:1883
      - -scenario
      - ${SCENARIO:-scenarios/no_faults.json}
    ports:
      - "8080:8080"
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
  vehicle-1:
    build: .
    command:
      - /app/vehicle
      - -id
      - vehicle-1
      - -broker
      - broker:1883
      - -scenario
      - ${SCENARIO:-scenarios/no_faults.json}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
  vehicle-2:
    build: .
    command:
      - /app/vehicle
      - -id
      - vehicle-2
      - -broker
      - broker:1883
      - -scenario
      - ${SCENARIO:-scenarios/no_faults.json}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
  vehicle-3:
    build: .
    command:
      - /app/vehicle
      - -id
      - vehicle-3
      - -broker
      - broker:1883
      - -scenario
      - ${SCENARIO:-scenarios/no_faults.json}
    volumes:
      - ./scenarios:/app/scenarios:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped
