<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Manager</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        canvas {
            background: #181818;
            border: 1px solid #333;
            border-radius: 6px;
            margin-top: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            font-family: monospace;
        }

        .status-online {
            color: #00ff66;
            font-weight: bold;
        }

        .status-offline {
            color: #ff3333;
            font-weight: bold;
        }

        .task-completed {
            color: #00ff66;
        }

        .task-working {
            color: #ffaa00;
        }

        .task-queued {
            color: #aaa;
        }

        .section-header {
            display: block;
            margin: 4px 0 6px;
        }

        table.fleet-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
        }

        table.fleet-table td {
            padding: 2px 14px 2px 0;
            white-space: nowrap;
            vertical-align: top;
        }

        table.fleet-table td.grow {
            width: 100%;
            white-space: normal;
        }

        /* ---------- Layout: grid and log side by side ---------- */

        .main-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .main-row canvas {
            flex: none;
            margin: 0;
        }

        .main-row .card {
            align-self: stretch;
            margin: 0;
        }

        /* Wide enough for the 600px grid, a gap and a usable log. */
        @media (min-width: 1141px) {
            .main-row {
                flex-direction: row;
                align-items: flex-start;
                gap: 20px;
            }

            .main-row .card {
                align-self: auto;
            }

            .log-card {
                box-sizing: border-box;
                flex: 1 1 0;
                min-width: 0;
                display: flex;
                flex-direction: column;
                height: 602px; /* same as the grid: 600px + 1px border per side */
            }

            .log-card .ev-toggle {
                align-self: flex-start;
            }

            .log-card .ev-scroll {
                flex: 1 1 auto;
                min-height: 0;
                max-height: none;
            }
        }

        /* ---------- Event log ---------- */

        .ev-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .ev-live {
            color: #777;
        }

        .ev-note {
            margin: 0 0 10px;
            line-height: 1.5;
            color: #777;
        }

        .ev-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            color: #aaa;
            cursor: pointer;
        }

        .ev-toggle input {
            margin: 0;
            accent-color: #888;
        }

        .ev-scroll {
            max-height: 320px;
            overflow-y: auto;
            padding-top: 8px;
            border-top: 1px solid #2d2d2d;
            scrollbar-width: thin;
            scrollbar-color: #3a3a3a transparent;
        }

        .ev-scroll td.grow {
            overflow-wrap: anywhere;
        }

        .ev-time {
            color: #777;
        }

        .ev-empty {
            padding: 12px 0;
            color: #666;
        }

        /* Narrow screens: time and kind on one line, message below. */
        @media (max-width: 560px) {
            .ev-scroll tr {
                display: grid;
                grid-template-columns: auto 1fr;
                padding-bottom: 6px;
            }

            .ev-scroll td.grow,
            .ev-scroll td.ev-empty {
                grid-column: 1 / -1;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Fleet Manager</h1>

    <div class="card" id="fleet-status">
        Connecting to Controller...
    </div>

    <div class="main-row">

        <canvas id="factory-floor" width="600" height="600"></canvas>

        <section class="card log-card" aria-label="Event log">
            <div class="ev-head">
                <strong class="section-header">Event log</strong>
                <span class="ev-live" id="ev-live">connecting&hellip;</span>
            </div>
            <div class="ev-note">
                Messages the controller receives and sends, plus the faults it injects.
                Faults injected by the vehicles show up only as gaps in the heartbeat
                sequence numbers.
            </div>
            <label class="ev-toggle">
                <input type="checkbox" id="ev-heartbeats" checked> Show heartbeats
            </label>
            <div class="ev-scroll" id="ev-scroll">
                <table class="fleet-table"><tbody id="ev-list"></tbody></table>
            </div>
        </section>

    </div>

</div>

<script>
    const canvas = document.getElementById("factory-floor");
    const ctx = canvas.getContext("2d");
    const statusDiv = document.getElementById("fleet-status");

    const scale = 5;
    const originX = canvas.width / 2;
    const originY = canvas.height / 2;

    // Stable colour for each vehicle.
    const vehicleHues = {};
    let vehicleColorIndex = 0;

    function hueForVehicle(id) {
        if (!(id in vehicleHues)) {
            vehicleHues[id] = (vehicleColorIndex * 137) % 360;
            vehicleColorIndex++;
        }

        return vehicleHues[id];
    }

    function colorForVehicle(id, alpha = 1) {
        return `hsla(${hueForVehicle(id)}, 90%, 60%, ${alpha})`;
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid
        ctx.strokeStyle = "#262626";
        ctx.lineWidth = 1;

        for (let g = -50; g <= 50; g += 10) {
            const sx = originX + g * scale;
            const sy = originY + g * scale;

            ctx.beginPath();
            ctx.moveTo(sx, 0);
            ctx.lineTo(sx, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, sy);
            ctx.lineTo(canvas.width, sy);
            ctx.stroke();
        }

        // Axes
        ctx.strokeStyle = "#444";
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(originX, 0);
        ctx.lineTo(originX, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, originY);
        ctx.lineTo(canvas.width, originY);
        ctx.stroke();
    }

    function drawTaskLine(vehicle, task) {
        const screenX = originX + vehicle.position.x * scale;
        const screenY = originY - vehicle.position.y * scale;

        const targetX = originX + task.destination.x * scale;
        const targetY = originY - task.destination.y * scale;

        const color = colorForVehicle(vehicle.id);

        // Line from vehicle to destination
        ctx.beginPath();
        ctx.strokeStyle = colorForVehicle(vehicle.id, 0.3);
        ctx.lineWidth = 2;
        ctx.moveTo(screenX, screenY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();

        // Destination marker
        const size = 8;

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(targetX - size, targetY - size);
        ctx.lineTo(targetX + size, targetY + size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(targetX + size, targetY - size);
        ctx.lineTo(targetX - size, targetY + size);
        ctx.stroke();
    }

    function drawVehicle(vehicle) {
        const screenX = originX + vehicle.position.x * scale;
        const screenY = originY - vehicle.position.y * scale;

        const color = colorForVehicle(vehicle.id);

        // Vehicle
        ctx.beginPath();
        ctx.arc(screenX, screenY, 14, 0, 2 * Math.PI);

        ctx.fillStyle = color;
        ctx.fill();

        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // ID
        ctx.fillStyle = "#fff";
        ctx.font = "12px monospace";
        ctx.fillText(
            vehicle.id,
            screenX - 20,
            screenY - 22
        );
    }

    function taskForVehicle(vehicle, tasks) {
        if (!vehicle.currentTask) {
            return null;
        }

        return tasks[vehicle.currentTask] || null;
    }

    function renderVehicleRow(vehicle, tasks) {
        const statusClass =
            vehicle.status === "OFFLINE" ? "status-offline" : "status-online";

        const task = taskForVehicle(vehicle, tasks);
        const taskText = task
            ? `${task.id} &rarr; (${task.destination.x}, ${task.destination.y})`
            : "idle";

        return `
            <tr>
                <td>&bull; <strong>[${vehicle.id}]</strong></td>
                <td>pos: (${vehicle.position.x}, ${vehicle.position.y})</td>
                <td><span class="${statusClass}">${vehicle.status}</span></td>
                <td class="grow">${taskText}</td>
            </tr>
        `;
    }

    function renderTaskRow(task) {
        let taskClass = "task-queued";

        if (task.status === "IN_PROGRESS") {
            taskClass = "task-working";
        } else if (task.status === "COMPLETED") {
            taskClass = "task-completed";
        }

        return `
            <tr>
                <td>&bull; <strong>[${task.id}]</strong></td>
                <td>&rarr; (${task.destination.x}, ${task.destination.y})</td>
                <td><span class="${taskClass}">${task.status}</span></td>
                <td class="grow">${
                    task.assignedVehicle ? `&rarr; ${task.assignedVehicle}` : ""
                }</td>
            </tr>
        `;
    }

    async function fetchFleetState() {
        try {
            const response = await fetch(
                "http://localhost:8080/api/state"
            );

            if (!response.ok) {
                throw new Error("Controller returned " + response.status);
            }

            const state = await response.json();

            drawGrid();

            const vehicles = state.vehicles || {};
            const tasks = state.tasks || {};

            const vehicleList = Object.values(vehicles);
            const taskList = Object.values(tasks);

            // Draw task routes first so vehicles appear on top.
            vehicleList.forEach(vehicle => {
                const task = taskForVehicle(vehicle, tasks);

                if (task && task.status === "IN_PROGRESS") {
                    drawTaskLine(vehicle, task);
                }
            });

            vehicleList.forEach(vehicle => drawVehicle(vehicle));

            let html = "<strong class=\"section-header\">Vehicles</strong>";

            if (vehicleList.length === 0) {
                html += "No vehicles connected.";
            } else {
                html += "<table class=\"fleet-table\">";
                vehicleList.forEach(vehicle => {
                    html += renderVehicleRow(vehicle, tasks);
                });
                html += "</table>";
            }

            html += "<strong class=\"section-header\">Tasks</strong>";

            if (taskList.length === 0) {
                html += "No tasks.";
            } else {
                html += "<table class=\"fleet-table\">";
                taskList.forEach(task => {
                    html += renderTaskRow(task);
                });
                html += "</table>";
            }

            statusDiv.innerHTML = html;

        } catch (err) {
            statusDiv.innerHTML =
                `<span class="status-offline">
                    LOST CONNECTION TO CONTROLLER
                </span>`;
        }
    }

    // Visualization only.
    // The Controller remains authoritative.
    setInterval(fetchFleetState, 200);

    fetchFleetState();

    // ---------------------------------------------------------------
    // Event log: what the controller receives and sends, plus the
    // faults it injects. Each event from /api/events has a type
    // (HEARTBEAT, MESSAGE or ERROR); colours reuse the table classes.
    // ---------------------------------------------------------------
    const EVENT_TYPE_CLASS = {
        HEARTBEAT: "task-queued",
        MESSAGE: "",
        ERROR: "status-offline",
    };

    const MAX_EVENT_ROWS = 300;

    const evScrollEl = document.getElementById("ev-scroll");
    const evListEl = document.getElementById("ev-list");
    const evHeartbeatsEl = document.getElementById("ev-heartbeats");
    const evLiveEl = document.getElementById("ev-live");

    let allEvents = [];
    let eventsT0 = null;        // time of the first event, for "+12.4s"
    let newestEventId = 0;
    let eventsKey = "";

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, ch => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
    }

    function formatClock(date) {
        return date.toLocaleTimeString("en-GB") + "." +
            String(date.getMilliseconds()).padStart(3, "0");
    }

    function renderEvents() {
        const visible = evHeartbeatsEl.checked
            ? allEvents
            : allEvents.filter(event => event.type !== "HEARTBEAT");

        const previousTop = evScrollEl.scrollTop;
        const previousHeight = evScrollEl.scrollHeight;

        if (visible.length === 0) {
            evListEl.innerHTML = `<tr><td class="ev-empty" colspan="3">${
                allEvents.length === 0
                    ? "Waiting for events&hellip;"
                    : "Only heartbeats so far &mdash; tick &ldquo;Show heartbeats&rdquo; to see them."
            }</td></tr>`;
        } else {
            // Newest first.
            evListEl.innerHTML = visible
                .slice(-MAX_EVENT_ROWS)
                .reverse()
                .map(event => {
                    const time = new Date(event.time);
                    const elapsed = Math.max(0, (time - eventsT0) / 1000);

                    return `
                        <tr title="${formatClock(time)}">
                            <td class="ev-time">+${elapsed.toFixed(1)}s</td>
                            <td><span class="${EVENT_TYPE_CLASS[event.type] || ""}">${escapeHtml(event.type)}</span></td>
                            <td class="grow">${escapeHtml(event.message)}</td>
                        </tr>
                    `;
                })
                .join("");
        }

        // Keep the reader's place when new rows appear above.
        if (previousTop > 0) {
            evScrollEl.scrollTop =
                previousTop + (evScrollEl.scrollHeight - previousHeight);
        }
    }

    function ingestEvents(events) {
        const first = events.length ? events[0].id : 0;
        const newest = events.length ? events[events.length - 1].id : 0;
        const key = `${first}:${newest}:${events.length}`;

        if (key === eventsKey) {
            return;
        }
        eventsKey = key;

        // The controller restarted: ids start over, so the log does too.
        if (newest < newestEventId) {
            eventsT0 = null;
        }

        if (events.length && (eventsT0 === null || first === 1)) {
            eventsT0 = Date.parse(events[0].time);
        }

        newestEventId = newest;
        allEvents = events.map(event => ({ ...event, type: event.type || "MESSAGE" }));

        renderEvents();
    }

    function setEventsLive(ok) {
        evLiveEl.textContent = ok ? "live" : "controller unreachable";
        evLiveEl.className = ok ? "ev-live" : "ev-live status-offline";
    }

    async function fetchEvents() {
        try {
            const response = await fetch("http://localhost:8080/api/events");

            if (!response.ok) {
                throw new Error("Controller returned " + response.status);
            }

            const data = await response.json();

            setEventsLive(true);
            ingestEvents(data.events || []);
        } catch (err) {
            setEventsLive(false);
        }
    }

    evHeartbeatsEl.addEventListener("change", () => {
        renderEvents();
        evScrollEl.scrollTop = 0;
    });

    setInterval(fetchEvents, 500);

    fetchEvents();
</script>

</body>
</html>
